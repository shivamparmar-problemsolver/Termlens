<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TermsLens Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <p class="eyebrow">TermsLens</p>
        <h1>Settings</h1>
        <p class="lede">
          API keys stay on the local backend. The extension only sends policy text to the URL you
          configure here.
        </p>
      </header>

      <form id="settings-form" class="panel">
        <label>
          Backend URL
          <input id="backend-url" type="url" placeholder="http://127.0.0.1:8787" required />
        </label>
        <label class="check">
          <input id="prefer-local" type="checkbox" />
          Use on-device heuristics only (never call the backend)
        </label>
        <button type="submit">Save settings</button>
        <p id="status" class="status" hidden>Saved.</p>
      </form>

      <section class="panel muted">
        <h2>Privacy</h2>
        <p>
          TermsLens does not create an account, does not collect browsing history, and does not
          send data anywhere except the backend URL above when you run a scan.
        </p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
